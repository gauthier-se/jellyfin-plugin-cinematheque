name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check web scripts
        run: |
          for f in src/Jellyfin.Plugin.Cinematheque/Web/*.js; do node --check "$f"; done
          # The configuration page keeps its script inline.
          python3 -c "import re; s = open('src/Jellyfin.Plugin.Cinematheque/Configuration/configPage.html').read(); open('$RUNNER_TEMP/configPage.js', 'w').write(re.search(r'<script[^>]*>(.*?)</script>', s, re.S).group(1))"
          node --check "$RUNNER_TEMP/configPage.js"

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build
