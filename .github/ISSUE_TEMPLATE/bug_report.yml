name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Cinematheque version
      placeholder: 0.1.0.0
    validations:
      required: true
  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin version
      placeholder: 12.1.0
    validations:
      required: true
  - type: dropdown
    id: layout
    attributes:
      label: Web client layout
      description: Dashboard > Display, or the user settings Display page.
      options:
        - Modern
        - Desktop (legacy)
        - Mobile (legacy)
        - TV
        - Not sure
  - type: input
    id: browser
    attributes:
      label: Browser or client
      placeholder: Firefox 140, Jellyfin Media Player...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log lines mentioning Cinematheque or FileTransformation, and any browser console errors.
      render: text
