changelog: >
  Fixes a web cache that showed one user's lists to the next on a shared browser, lists
  that stopped at 480 items, collections left out of sync, and a configuration page that
  could erase movements. The library is read once for every user, and the tab sits in
  Jellyfin's header. Removes the 0.1 Directors and Actors endpoints. See CHANGELOG.md.
