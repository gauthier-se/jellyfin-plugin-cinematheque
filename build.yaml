overview: "Browse your films by director, actor, country and film movement"
description: >
  Cinematheque adds a tab to the Jellyfin web client for film lovers: directors and
  actors with their filmography in your library, national cinemas (Hong Kong, Japan,
  Italy...) with a decade breakdown, and curated film movements such as the French
  New Wave or Italian Neorealism. Requires the File Transformation plugin for the tab.
